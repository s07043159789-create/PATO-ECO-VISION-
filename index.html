<!DOCTYPE html>
<html>
 <head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>expense tracker</title>
  <link rel="stylesheet" href="style.css">
 </head>
 <body>
  <nav>
    <h1>Expense Tracker</h1>
    <div class="links">
      <a href="index.html">Home</a>
      <a href="expense.html">Expenses</a>
      <a href="settings.html">Settings</a>
    </div>
  </nav>
  <main>
   <div class="analytics-currency">
    <p>Dashboard Analytics</p>
    <p>Currency: <span id="currency">None</span></p>
   </div>
    
    <div id="analytics-container" class="analytics-container">
      
      <div class="card">
        <p>Weekly Budget:<span id="stats1">0</span></p>
        <p class="budget-update">go to settings to enter your weekly budget</p>
      </div>
      <div class="card">
        <p>Total Expenses:<span id="stats2">0</span></p>
      </div>
      <div class="card">
        <p>Total Amount Spent:<span id="stats3">0</span></p>
      </div>
      <div class="card">
        <p id="overBudget" class="budget-update"></p>
        <p>Remaining Budget:<span id="stats4">0</span></p>
      </div>
     
    </div>
    <div id="input" class="input">
      
      <p id="paragraph"></p>
      
      <p><input id="name" type="text" placeholder="Expense Name"></p>
      
      <p><input id="amount" type="number" placeholder="Amount"></p>
      
      <select name="category" id="category" >
        <option value=""> Select Category</option>
        <option value="🍔 Food">🍔 Food</option>
        <option value="🚕 Transport">🚕 Transport</option>
        <option value="📱 Data">📱 Data</option>
        <option value="🎮 Entertainment">🎮 Entertainment</option>
        <option value="📚 Education">📚 Education</option>
        <option value="🛒 Shopping">🛒 Shopping</option>
        <option value="💡 Bills">💡 Bills</option>
      </select>
      
      <p><textarea id="textarea" placeholder="Enter Description (optional)"></textarea></p>
      
      <div class="btn-container">
        <button id="add">Add</button>
        
        <button id="back">Done</button>
        
        <button><a href="expense.html">View Expenses</a></button>
      </div>
    </div>
  </main>
    <div id="add-expense-con" class="add-expense-con">
      <p><button id="add_expense" class="add">Add Expense</button></p>
    </div>
  <script src="index.js"></script>

 </body>
</html>
